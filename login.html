    /* Brillo ambiental discreto para dar profundidad sin ocultar la imagen */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 14% 18%, rgba(242, 184, 75, 0.18), transparent 32%),
        radial-gradient(circle at 88% 82%, rgba(18, 117, 190, 0.22), transparent 35%);
    }

    /* MÓDULO DE LOGIN EN ALTO RELIEVE (TARJETA 3D / NEUMORFISMO) */
    .login-card {
      background: rgba(255, 255, 255, 0.985);
      padding: 40px 35px;
      border-radius: 22px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 100%;
      max-width: 400px;
      /* Efectos de sombras múltiples para el alto relieve */
      box-shadow: 
        0 20px 35px -10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.92);
      outline: 1px solid rgba(240, 180, 70, 0.42);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      box-shadow: 
        0 25px 45px -10px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(255, 255, 255, 0.12);
    }

    /* EMBLEMA / LOGO LIONESS */
    .logo-container {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px auto;
      background: linear-gradient(145deg, #ec111a 0%, #c40d14 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 18px rgba(236, 17, 26, 0.4);
      color: #ffffff;
    }

    .logo-container svg {
      width: 42px;
      height: 42px;
      fill: currentColor;
    }

    /* TÍTULOS */
    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #002244;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 25px;
      letter-spacing: 0.3px;
    }

    /* CAMPOS DEL FORMULARIO */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      background-color: #f8fafc;
      transition: all 0.25s ease;
      color: #0f172a;
    }

    input:focus {
      outline: none;
      border-color: #ec111a;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(236, 17, 26, 0.12);
    }

    /* BOTÓN CON EFECTO DE PRESIÓN Y RELIEVE */
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: linear-gradient(180deg, #ec111a 0%, #c40d14 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      box-shadow: 0 6px 14px rgba(236, 17, 26, 0.35);
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(236, 17, 26, 0.45);
      background: linear-gradient(180deg, #ff1a24 0%, #d60e15 100%);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(236, 17, 26, 0.3);
    }

    button:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* MENSAJES Y NOTIFICACIONES */
    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      border-radius: 6px;
    }

    .error {
      color: #991b1b;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
    }

    .success {
      color: #166534;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    @media (max-width: 700px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(3, 27, 57, 0.18), rgba(3, 27, 57, 0.38));
      }
    }

    @media (max-width: 480px) {
      body {
        background-attachment: scroll;
        padding: 18px 14px;
      }
      .login-card {
        padding: 32px 24px;
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- LOGO LIONESS (ISOTIPO LEÓN) -->
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <!-- Icono estilizado de León / Escudo Comercial -->
        <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
      </svg>
    </div>

    <h1 class="login-title">PORTAL LIONESS</h1>
    <p class="login-subtitle">Líderes en DXP • Gestión Comercial</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="dni">DNI / Usuario</label>
        <input type="text" id="dni" required placeholder="Ingrese su número de DNI">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btnSubmit">Ingresar al Sistema</button>
    </form>

    <div id="message" class="message" style="display: none;"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySlv4eKJroJaBcsRPFAVtNs7m1JgKdiHJUfEi_nYntUSxS48WyoqaM49L_o1b9IvXa/exec";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const dni = document.getElementById('dni').value.trim();
      const password = document.getElementById('password').value.trim();
      const messageDiv = document.getElementById('message');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!dni || !password) {
        messageDiv.style.display = "block";
        messageDiv.className = "message error";
        messageDiv.textContent = "Por favor, ingresa DNI y contraseña.";
        return;
      }

      localStorage.removeItem('user');
      localStorage.removeItem('sessionToken');

      messageDiv.style.display = "block";
      messageDiv.className = "message";
      messageDiv.textContent = "Verificando credenciales...";
      btnSubmit.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ dni: dni, password: password })
        });

        if (!response.ok) {
          throw new Error("El servidor respondió con HTTP " + response.status);
        }

        const data = await response.json();
        console.log("Respuesta del servidor:", data);

        if (!data.success) {
          messageDiv.className = "message error";
          messageDiv.textContent = data.message || "Credenciales incorrectas.";
          return;
        }

        if (!data.user) {
          throw new Error("El servidor validó el acceso pero no devolvió los datos del usuario.");
        }

        if (!data.token) {
          throw new Error(
            "El servidor validó el acceso, pero NO devolvió el token de sesión. " +
            "Debes volver a implementar/publicar el Apps Script actualizado."
          );
        }

        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('sessionToken', data.token);

        messageDiv.className = "message success";
        messageDiv.textContent = `¡Bienvenido(a) ${data.user.nombre}! Redirigiendo...`;

        setTimeout(function() {
          window.location.replace('dashboard.html');
        }, 700);

      } catch (error) {
        console.error("Error de Login:", error);
        messageDiv.className = "message error";
        messageDiv.textContent = error.message || "Error al conectar con el servidor.";
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
